<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="url(#bgGradient)" rx="20"/>
  <!-- Money/Credit Symbol -->
  <circle cx="50" cy="50" r="35" fill="white" opacity="0.95"/>
  <!-- Dollar signs -->
  <text x="50" y="60" font-size="50" font-weight="bold" text-anchor="middle" fill="#1e40af">$</text>
  <!-- Small circle decoration -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="white" stroke-width="2" opacity="0.3" rx="20"/>
</svg>
